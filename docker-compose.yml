services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spo}
      POSTGRES_USER: ${POSTGRES_USER:-spo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - spo_postgres_data:/var/lib/postgresql/data
    # Só expõe a BD localmente para administração; não a publiques na Internet.
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spo}
      DATABASE_SSL: "false"
      FILES_PROVIDER: local
    ports:
      - "${APP_PORT:-18473}:3000"
    volumes:
      - spo_uploads:/app/.uploads

volumes:
  spo_postgres_data:
  spo_uploads:
